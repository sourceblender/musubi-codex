name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install plugin and development checks
        run: python -m pip install '.[dev]'
      - name: Lint
        run: ruff check musubi_codex tests
      - name: Format
        run: ruff format --check musubi_codex tests
      - name: Type check
        run: mypy musubi_codex
      - name: Tests
        run: pytest -q
      - name: Native hook proof
        run: python evals/run_native_hook_proof.py
      - name: Prompt recall proof
        run: python evals/run_prompt_recall_deep_proof.py
      - name: Two-seat isolation proof
        run: python evals/run_seat_isolation_proof.py
